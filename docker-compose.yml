services:
  loveyouforever:
    build: .
    container_name: loveyouforever
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      LYF_ENV: production
      LYF_SITE_NAME: 永远爱你
      LYF_SECRET_KEY: ${LYF_SECRET_KEY:-}
      LYF_TIMEZONE: Asia/Shanghai
      LYF_BACKUP_KEEP: "30"
    volumes:
      # 数据、备份、上传的内容都挂出来，容器删了也不丢
      - ./instance:/app/instance
      - ./backups:/app/backups
      - ./themes:/app/themes
      - ./app/static/uploads:/app/app/static/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/api/stats')"]
      interval: 30s
      timeout: 5s
      retries: 3
