{% if pagination and pagination.pages > 1 %}
<nav class="pagination" aria-label="分页">
  {% if pagination.has_prev %}
    <a class="page-link" href="{{ page_url(pagination.prev_num) }}">← 上一页</a>
  {% else %}
    <span class="page-link disabled">← 上一页</span>
  {% endif %}

  <span class="page-info">{{ pagination.page }} / {{ pagination.pages }}</span>

  {% if pagination.has_next %}
    <a class="page-link" href="{{ page_url(pagination.next_num) }}">下一页 →</a>
  {% else %}
    <span class="page-link disabled">下一页 →</span>
  {% endif %}
</nav>
{% endif %}
