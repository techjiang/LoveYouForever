{% extends "base.html" %}
{% block title %}{{ page.title }} · {{ site.name }}{% endblock %}
{% block content %}
<div class="page-hero">
  <div class="container"><h1>{{ page.title }}</h1></div>
</div>
<section class="section">
  <div class="container" style="max-width:780px">
    <div class="post-body">{{ page.content_html | safe }}</div>
  </div>
</section>
{% endblock %}
